name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API (dev)
        run: |
          cd apps/api
          python3 -m venv .venv
          .venv/bin/pip install -U pip -q
          .venv/bin/pip install -e '.[dev]' -q
      - name: Pytest (default; skips optional Ollama/MinerU)
        run: cd apps/api && .venv/bin/pytest -q -m "not optional"
